<h1>🔬 دليل المذاكرة: مناهج البحث العلمي</h1>
<div class="sub">كل المحاضرات في صفحة واحدة • اضغط على أي بطاقة لتفتحها • ابحث بكلمة • ثم جرّب الامتحان</div>

<script>
const S=[
["أساسيات العلم والبحث","العلم نشاط منظم، والبحث العلمي أسلوبه العملي. ابدأ من هنا.",[
["العلم والمعرفة",`<b>العلم:</b> نشاط إنساني ديناميكي يشكل أحد فروع المعرفة، وهو المعرفة المنسقة التي تنشأ عن الملاحظة والتجريب لتحديد طبيعة وأسس ما يُدرس.<ul><li><b>طرق الحصول على المعرفة:</b> المصادفة، المحاولة والخطأ، مصادر السلطة والثقة، التقاليد والعقائد والقيم، الاستدلال العلمي.</li><li><b>مراحل تطور المعرفة:</b> الحسية ← التأملية ← الدينية ← العلمية.</li><li><b>خصائص المعرفة العلمية:</b> التراكمية، التنظيم، البحث عن الأسباب، الشمولية، التجريد، النظرة الموضوعية.</li></ul>`],
["أساسيات العلم وأهدافه وخصائصه وافتراضاته",`<ul><li><b>أساسيات العلم (7):</b> الحقائق، المفاهيم، التعميمات، المبادئ العلمية، النظريات والمنطق، الأسئلة، التصور الفكري للمفاهيم.</li><li><b>أهداف العلم (3):</b> الشرح والفهم، التنبؤ، الضبط والتحكم.</li><li><b>خصائص العلم (6):</b> الموضوعية، الوصف الكمي، أنه غير قطعي وغير نهائي، الدقة والتكامل، الاستعانة بالعلوم الأخرى، التراكمية.</li><li><b>افتراضات العلم (3):</b> الثبات، الحتمية، التشابه.</li></ul>`],
["أنواع التفكير الهادف",`<ul><li><b>الاستنباطي (القياسي):</b> انتقال من مقدمة أو أكثر (معرفة قديمة) إلى معرفة جديدة، ويتعامل مع النظريات كاحتمالات يمكن تأييدها أو نفيها.</li><li><b>الاستقرائي:</b> التحقق من صدق معرفة جزئية بالملاحظة والتجربة المتكررة لتعميم النتائج. هو صدق احتمالي وليس برهانًا، ويساعد على التنبؤ.<br>نوعان: <b>تام</b> (وسيلة إلى معرفة وليس غاية) و<b>حدسي</b> (ينقل من الملاحظة والتجربة إلى تكوين الفرض الذي يفسرهما).</li></ul>`],
["البحث العلمي: تعريفه وأهدافه وخصائصه",`<b>البحث العلمي:</b> أسلوب فكري واعٍ ومنظم يهدف لبحث الظواهر والمشاكل والتعرف على أسبابها وجوانبها واختبار العلاقات بينها والكشف عن حقائق محددة تُطرح كفرضيات أو تساؤلات.<br><b>منهج البحث:</b> طريقة منظمة تعتمد على الفرضيات وعلى قواعد وقوانين تهيمن على سير البحث وتفرض على الباحث التقيد بها.<ul><li><b>الأهداف (6):</b> الوصف، التنبؤ، التفسير، التقويم، الدحض، التثبت.</li><li><b>الخصائص (7):</b> عملية منظمة وهادفة، الأصالة، الإبداع، الأمانة العلمية، الموضوعية، الدقة، الاعتماد على الدليل بدلًا من المصدر.</li></ul>`],
["أنواع البحوث",`<b>التصنيفات الأربعة:</b> حسب دقتها وأسلوب المعالجة، حسب نوعيتها، حسب القائمين بها، حسب أسلوبها وطبيعة المشكلة.<ul><li><b>النظري (الأساسي):</b> أغلب الدراسات الأكاديمية، هدفه الفهم وتقديم تفسيرات نظرية.</li><li><b>التطبيقي:</b> في القطاعات الحكومية أو الأهلية، لمعالجة مشكلة وتمكين متخذي القرار.</li><li><b>الموجَّه:</b> في المجالات المهنية والمنظمات والمشكلات الاجتماعية، بقصد فهمها وتقييمها ومعالجتها والتنبؤ بها.</li></ul>`],
["مهارات الباحث ومصادر البحث",`<ul><li><b>المهارات (7):</b> الملاحظة، المقارنة، التصنيف، القياس والصياغة الكمية، الاستنتاج، التنبؤ، التجريب.</li><li><b>المصادر (9):</b> الأدبيات السابقة، المقالات المهنية، الأبحاث المتخصصة، الندوات والمؤتمرات، الإحصائيات والتقارير، الصعوبات التي تواجه الباحث وقدرته على الملاحظة، الرغبة في التقصي والازدياد المعرفي، تكليف الباحث من جهة أخرى، تأثير المشرف أو الزملاء.</li></ul>`],
["مشكلات البحث واستخدامات المكتبة",`<ul><li><b>مشكلات البحث (4):</b> تتعلق بموضوع البحث، بالباحث، بالمجتمع والعينة، بتصميم البحث وأدوات جمع المعلومات.</li><li><b>استخدامات المكتبة (7):</b> محتوياتها وتنظيمها، البحث فيها، تقنية المعلومات، مشكلات الباحث المبتدئ، قواعد ونظم الاستخدام، أساليب التوثيق (الاقتباس المباشر وغير المباشر)، الهوامش وطريقة كتابتها.</li></ul>`]
]],
["المشكلة والفروض والأهداف","قلب البحث: مشكلة محددة ← أسئلة ← فروض قابلة للاختبار.",[
["كيف نتعرف على مشكلة البحث؟ وكيف نختارها؟",`<b>مصادر التعرف:</b> تحديد المجال الذي يخص مستقبل الباحث، استشارة المتخصصين، الخبرة العلمية، حداثة الموضوع، العمل مع فريق، إعادة بحث سابق للتأكد من النتائج، توصيات الدراسات السابقة، وسائل الإعلام.<br><b>مؤشرات الاختيار الموفق (4):</b> عدم الإضرار بمصلحة عامة، عدم مخالفة مبدأ شرعي أو قيمة أو عرف، مشكلة قابلة للقياس، رغبة الباحث في الموضوع.<br><b>أخطاء شائعة (4):</b> مشكلة واسعة النطاق، أول مشكلة تخطر بالبال، المثالية الزائدة، الركاكة وعدم الوضوح.<div class="tip">فكرة جوهرية: البحث الذي يخلو من إشكالية محددة ليس جديرًا بصفة العلمية.</div>`],
["صياغة المشكلة ومعاييرها وأنواعها",`<ul><li><b>الصيغة التقريرية (اللفظية):</b> جملة خبرية، مثل: «علاقة الذكاء بالتحصيل الدراسي».</li><li><b>الصيغة الاستفهامية:</b> سؤال، مثل: «ما أثر الذكاء على التحصيل؟». هي المفضلة لأنها تبرز العلاقة بين المتغيرين وتحدد الهدف الرئيسي.</li></ul><b>المعايير:</b> محددة وواضحة بحيث يمكن حلها، تعبر عن علاقة بين متغيرين أو أكثر، بصيغة سؤال، قابلة للاختبار والتجريب.<br><b>أنواع المشكلات:</b> ملحة ومهمة (أولوية عالية)، غير ملحة وأقل أهمية (أولوية أقل)، ملحة لكن أهميتها متدنية أو العكس (تتحدى قدرة الفرد فيتخذ القرار في ترتيبها).`],
["الأسئلة والفروض: أهميتها",`<b>الأسئلة:</b> تساعد على التعرف على جوانب الموضوع، تنبّه لأسئلة يرغب الباحث في إجاباتها، تضع الدراسة على الطريق الصحيح، وهي إحدى لبنات البحث (متوسط أسئلة البحث 5 إلى 7).<br><b>أهمية الفروض:</b><ul><li>تزيد قدرة الباحث على فهم الظاهرة بتفسير العلاقات بين المتغيرات.</li><li>ترشد جمع البيانات ذات الصلة.</li><li>تحدد الأساليب والإجراءات المناسبة لاختبار الحل.</li><li>تقدم تفسيرات للأحداث وأسبابها.</li><li>تنظم النتائج وتقدمها بطريقة ذات معنى؛ فالفرض تفسير أولي يحتفظ بطابع التخمين حتى تتوفر الحقائق، وإن عارضته الأدلة يُرفض.</li><li>قد تستثير فروضًا أخرى وتفسيرات جديدة.</li></ul>`],
["صياغة الفروض: الإثبات والنفي (الصفري)",`<ul><li><b>الإثبات (الفرضية المباشرة):</b> تؤكد وجود علاقة سالبة أو موجبة بين متغيرين، وقد تكون متجهة عندما يملك الباحث أسبابًا لتوقع الاتجاه. مثال: مستوى القلق عند الأذكياء أعلى منه عند ذوي الذكاء المنخفض.</li><li><b>النفي (الفرضية الصفرية):</b> تنفي وجود علاقة أو فروق، لأن الباحث لا يعلم بوجودها مسبقًا. هي الأسهل لأنها أكثر تحديدًا فيمكن قياسها والتحقق من صدقها.</li></ul>`],
["اختبار الفروض (4 طرق)",`<ol><li><b>الحذف:</b> حصر كل العوامل ذات العلاقة، واختبارها عاملًا عاملًا، وحذف ما ثبت عدم تأثيره حتى نصل للعوامل الكبيرة التأثير. أبسط الطرق.</li><li><b>استنباط المترتبات:</b> التحقق بمعرفة القضايا التي تترتب على الفرض. مثال: من قرع جرس الباب؟ مباشر، وللتفسيرات العلمية غير مباشر.</li><li><b>التلازم النسبي:</b> طريقة استقرائية لإثبات أو نفي علاقة سببية بمقارنة ظاهرتين وتتبع تغيراتهما. مثال: ارتفاع معدل المواليد كلما انخفض دخل الأسرة.</li><li><b>الطرق الإحصائية:</b> أدوات واختبارات ومقاييس مناسبة.</li></ol><div class="tip">تُقبل الفروض إذا وجد الباحث دليلًا واقعيًا يتفق مع جميع مترتباتها. وإن ظهرت أدلة تعارضها وجب التخلي عنها ولو كانت مغرية.</div>`],
["معايير الفرضية الجيدة وأهدافها والمتغيرات",`<b>المعايير (9):</b> تقرر العلاقات المتوقعة، لها سبب قوي أو أساس نظري، موجزة، شاملة ومرتبطة بحقائق، قابلة للفحص والاختبار، الاعتماد على فروض متعددة، المعقولية والبعد عن العمومية، القدرة على تفسير الظاهرة، الاتساق والبساطة.<br><b>أهدافها:</b> المساعدة في تصميم البحث وتنفيذه، إيجاد جواب مؤقت لسؤال البحث، تسهيل التحليل الإحصائي.<br><b>أنواعها:</b> متجهة وغير متجهة، إحصائية، صفرية وغير صفرية.<br><b>المتغيرات:</b> مستقلة، تابعة، ثانوية وتجريدية ودخيلة. وتُعرَّف تعريفًا اصطلاحيًا وإجرائيًا.`],
["أهداف البحث وأهميته وحدوده ومحدداته",`<b>الأهداف:</b> محددة ويمكن قياسها، دقيقة وثيقة الصلة بالمشكلة، قابلة للتحقيق في ضوء الوقت والجهد.<br><b>الأهمية:</b> علمية وعملية.<br><b>الحدود:</b> زمانية، مكانية، موضوعية، العينة (وتُذكر في أول محاضرة: مادية، مكانية، زمنية).<br><b>المحددات (القصور):</b> مصدره الباحث (ثقافته، انتماؤه، إنجازه)، أو المبحوثون (عدم الاعتراف، الدفع من قيمة الشخص «التغطية»)، أو تصميم البحث (العينة والمجتمع، الإدارة، حدوث خلل أثناء التجربة).`]
]],
["كتابة البحث وتنظيمه","العنوان والمقدمة والتقسيمات والخاتمة والمراجع والتنظيم الشكلي.",[
["عنوان البحث: الشروط",`<ul><li>محدد ويتضمن أهم عناصر البحث، بعبارة مختصرة ولغة سهلة، يبدأ بالكلمات المحورية، ويعبر عن المتغيرات المستقلة والتابعة. <b>لا يزيد عن 15 كلمة.</b></li><li><b>الموضوعي:</b> يعبر عن المضمون دون زيادة أو نقصان، يعكس الإشكالية، يبرز الأهمية، ويفضل أن يبين نوع المنهج والأدوات.</li><li><b>الشكلي:</b> محدد ومركز بعيد عن التعميم والتطويل، واضح خالٍ من الغموض، مباشر. وإن كان الموضوع مبتكرًا جدًا يُضاف عنوان فرعي.</li></ul><div class="tip">المفهوم الخاطئ: «كلما كان العنوان كبيرًا وعامًا كان أجود». الصحيح العكس: كلما كان محددًا ومختصرًا كان أجود. ويُفضَّل أن يعكس علاقة بين متغيرين على الأقل.</div>عنوان الكتاب يميل إلى الإثارة التسويقية، أما عنوان البحث فمختصر وواضح.`],
["العنوان والأسلوب الإحصائي",`شكل صياغة العنوان يحدد التحليل المطلوب:<ul><li><b>وصفي</b> («ما الخصائص…؟») ← إحصاء وصفي (تكرارات ونسب).</li><li><b>علاقة</b> («العلاقة بين…») ← معاملات ارتباط.</li><li><b>أثر</b> («أثر… في…») ← تحليل انحدار.</li><li><b>فروق</b> («الفروق بين…») ← اختبارات متعددة (ز، ت، ف…).</li></ul>لا تصغ عنوانًا بمصطلح «أثر» إن كنت لا تعرف تحليل الانحدار. يجب التناسق بين العنوان والإحصاء وكامل الرسالة. الأسلوب الإحصائي أداة للإجابة عن التساؤلات.<br><b>ملاحظات:</b> أسئلة الاستمارة تخدم أسئلة الدراسة فقط، والتوصيات تدعمها نتيجة وصلت إليها، ولا تستخدم كلمات مترادفة (فاعلية/فعالية/أهمية) بل مصطلحًا واحدًا. ابتعد عن الزخرفة والإطارات الملونة، ووحّد نوع الخط وحجمه.`],
["المقدمة وعناصرها وتحديد المشكلة",`المقدمة هي الباب الرئيسي الذي ندخل منه إلى صلب الموضوع، تحفز على القراءة، وتقدم نوايا الكاتب والغاية والأسباب. وكثير من الباحثين يعتبرونها بمثابة الفصل الأول.<br><b>العناصر:</b><ul><li><b>الخلفية النظرية (أدب الموضوع):</b> الإطار النظري والدراسات الخاصة بالموضوع بإيجاز.</li><li><b>أهمية الموضوع</b> وانعكاساته.</li><li><b>استعراض الجهود السابقة:</b> ما فعله الآخرون، جوانب النقص والقصور، طول الفترة الزمنية، وأوجه تميز دراستك.</li></ul>استطلاع الدراسات السابقة مهم لتجنب الأخطاء والتكرار غير المفيد.`],
["التقسيمات (التاريخي والبنيوي)",`<ul><li><b>التبويب التاريخي:</b> تقسيم الموضوع حسب تطوره عبر التاريخ، سواء ظاهرة طبيعية أو إنسانية.</li><li><b>البنيوية:</b> رائجة في العلوم الإنسانية، تركز على دراسة «بنية» الموضوع بدراسة مكوناته ومبادئه والعلاقات بينها، ورصد روابطه الخارجية والداخلية وتفاعلاته.</li></ul>يمكن المزج بينهما وهو الأفضل. <b>التسلسل:</b> مقدمة ← باب ← فصل ← مبحث ← مطلب ← فرع ← خاتمة.`],
["الخاتمة والفرق بينها وبين الخلاصة",`<b>الخاتمة:</b> حصيلة البحث وتجسيد للنتائج النهائية، تقدم للقارئ بشكل مكثف نتائج البحث وما أسفر عنه من جديد وحلول الإشكالية وما يثيره من إشكاليات جديدة. مرتبطة بالمقدمة (تجيب عن فرضياتها وتساؤلاتها). وليست ترديدًا لما جاء في المتن بل ربط للعناصر واستخلاص للنتائج. والباحث النزيه يمارس فيها «نقدًا ذاتيًا» ليؤكد وعيه بمشاكل موضوعه.<br><b>الخلاصة:</b> تلخيص حرفي للدراسة، تستعمل لأغراض أخرى: مطلوبة من المجلات ومراكز جمع الرسائل الجامعية لتعريف القارئ بفحوى الدراسة.`],
["المصادر والمراجع وترتيبها وكتابة بياناتها",`<b>المصدر:</b> مؤلفات الشخصية موضوع البحث. <b>المرجع:</b> الدراسات التي كتبها آخرون عنها.<br>تشمل القائمة كل ما رُجع إليه وأُحيل عليه في الهوامش، وكل دراسة استفاد منها الباحث ولم يشر إليها. والأمانة تقتضي ألا يذكر مصدرًا لم يطلع عليه إيهامًا بسعة الاطلاع.<br><b>طرق الترتيب (4):</b> ألفبائي حسب أسماء المؤلفين، قسمان (مصادر ومراجع) كلٌّ أبجديًا، حسب الموضوعات ثم ألفبائيًا داخل كل تصنيف، حسب نوع المصدر (كتب، دوريات، متنوعات، مستندات، تقارير، أبحاث غير منشورة…). وإن تعددت اللغات تُذكر كل مجموعة مستقلة.<br><b>كتاب:</b> لقب المؤلف، اسمه الشخصي فاسم أبيه، اسم المرجع بخط أسود أو مائل أو تحته خط، رقم الطبعة، مكان النشر، الناشر، سنة النشر. مؤلف مجهول يُكتب «مجهول».<br><b>مقال:</b> المؤلف، عنوان المقال بين شولتين، اسم المجلة، رقم العدد، تاريخه بين قوسين، رقم الصفحات.<br><b>رسالة جامعية:</b> المؤلف، عنوان الرسالة، النوع (ماجستير أو دكتوراه)، منشورة أم لا، الجامعة، سنة الإجازة.<br>الأشيع وضع القائمة في نهاية البحث.`],
["الفهرس وتنظيم الرسالة",`<b>الفهرس:</b> بمثابة المرشد الجغرافي للقارئ، يرتب العناوين مع أرقام صفحاتها. موضعه أول الدراسة أو آخرها كلاهما جائز، والأفضل عمليًا في النهاية.<br><b>فصول الرسالة (5):</b><ol><li>خلفية الدراسة ومشكلتها (المشكلة، الأهمية، الأهداف، خلفية المشكلة، مخطط الدراسة، خلاصة الفصل).</li><li>الإطار النظري والدراسات السابقة (يُستحسن البدء بالأحدث لأنها تشمل الأقدم، ويُختم بخلاصة).</li><li>المنهجية والتصميم.</li><li>عرض النتائج.</li><li>الخلاصة والمناقشة والتوصيات.</li></ol><b>الصفحات التمهيدية:</b> الغلاف (العنوان بعبارة «رسالة مقدمة إلى قسم… استكمالًا لمتطلبات…»، اسم الطالب، المشرف)، حقوق النشر، الاعتماد، الإهداء، الشكر والعرفان، جدول المحتويات، فهرس الجداول والأشكال، الملاحق. تُرقَّم أبجديًا عدا الغلاف فلا يُرقَّم لكنه يُحسب.<br><div class="tip">لا تقل «قام الباحث» أو «توصل الباحث»، بل «توصلت الدراسة»، حفاظًا على الموضوعية والحيادية.</div>`],
["السياق والمجتمع والعينة",`<b>السياق:</b> البيئة التي تمت فيها الدراسة، ويجب وصفه كاملًا لأن النتائج تعتمد عليه.<br><b>مجتمع الدراسة:</b> المجتمع الذي تُسحب منه العينة (طلاب الجامعة مثلًا). من أهداف الباحث غير المعلنة تعميم النتائج عليه، لذلك يجب أن تكون العينة ممثلة له، وتكون <b>عشوائية</b>.<br><b>العينة:</b> جزء من المجتمع (ناس أو أشياء) تتعامل معهم الدراسة، وحدة التحليل فيها. يجب وصف كيفية اختيارها وخصائصها الديمغرافية (العمر، الجنس، الرتبة، الخبرة، نوع القطاع) لأنها تتيح المقارنات والكشف عن الفروق.`]
]],
["المنهج والقياس والعينات","كيف نختار المنهج؟ وكيف نقيس؟ ومن نختار؟",[
["أدبيات البحث: الإطار النظري والدراسات السابقة",`<b>فوائد الدراسات السابقة:</b> تحديد المشكلة بدقة، البحث عن طرق جديدة لدراستها، تفادي التكرار، الاستفادة من المنهجية، معرفة كيفية عرض الدراسات والإطار النظري. ثم الملخص والتعليق.<br><b>أخطاء الباحثين في الإطار النظري:</b> الاستعجال وعدم مراجعة كاملة، الاعتماد على المصادر الثانوية فقط، التركيز على النتائج دون غيرها، عدم الاطلاع على مصادر بلغات مختلفة، النقل والتوثيق الخاطئ، النقل دون إسهام الباحث، عدم البحث عن المترادفات (النمطية اللغوية).`],
["مناهج البحث: التعريف والاختيار",`<b>المنهج:</b> الطريقة التي يتبعها الباحث في إجراء دراسته، أي الإجراءات والأساليب والكيفية التي يتم بها البحث.<br><b>أسباب تعدد التصنيفات:</b> عدم وجود اتفاق مسبق على مسمى واحد لمصطلح منهج البحث، البحث الواحد قد يتطلب أكثر من منهج، البحث السلوكي معقد ومتداخل، والخلط بين مفهوم منهج البحث وإدارة البحث وإجراءاته.<br><b>أسس اختيار المنهج:</b> صيغة التفكير (استقرائي/استنباطي)، زمن البحث (تاريخي/وصفي/تتبعي)، مكانه (حقلي/مسحي/دراسة حالة/مكتبي)، هدفه (وصفي/سببي/ارتباطي)، ضبط المتغيرات (تجريبي/شبه تجريبي)، إمكانية التطبيق (أساسي/تطبيقي)، طريقة التحليل (كمي/كيفي).<br><b>تجنب:</b> اتخاذ المنهج هدفًا (هو وسيلة فقط)، عدم التأكد من ملاءمته أو عدم الإلمام به، عدم القدرة على تعديله، عجزه عن توفير البيانات المطلوبة أو معالجتها.<br><b>تصنيف المناهج:</b> تجريبي وشبه تجريبي، حقلي، مسحي، تاريخي.<br><b>الأسس المستخدمة في هذا التصنيف (5):</b> الانتشار والشيوع في العلوم السلوكية، إمكانية استخدام المناهج السابقة إلى جانب أخرى، الاستجابة لمتطلبات العلوم السلوكية باستخدام منهجية محددة، الاستجابة لطبيعة أدوات جمع البيانات المختلفة وأساليب تحليلها، شمولية التصنيف.`],
["المنهج التجريبي وشبه التجريبي",`أنواع التجارب: معملية، حقلية، وصفية.<br><b>تصميم التجربة:</b> اختيار التصميم، تحديد الحاجة لمجموعة ضابطة، هل يُسحب الأعضاء عشوائيًا، كيفية تحليل البيانات.<br><b>عند الاستخدام:</b> حدد التصميمات الممكنة والمحددات، واختر الأنسب للمشكلة. تصميم المتغير الواحد وتصميم المتغيرات المتعددة.`],
["القياس والتعريف الإجرائي",`<b>القياس:</b> عمليات تقرر نوع ودرجة شيء ما بتحديد أرقام مرتبطة رمزيًا بنوعه ودرجته. <b>البناء:</b> المفهوم النظري. <b>المتغير:</b> الصفة أو السمة. <b>التعريف الإجرائي:</b> كيف وبأي وسيلة تُقاس الظاهرة.<br><b>لماذا يكون التعريف الإجرائي غالبًا غير فعال؟</b> الاعتماد على تعريف واحد، لأنه لا يقيس إلا نفسه، ويعيق تحسين وتطوير القياس.<div class="tip">مستويات القياس (4): الاسمي، الرتبي، الفئوي، النسبي.</div>`],
["الصدق والثبات",`<b>الصدق:</b> إلى أي درجة يقيس المقياس ما صُمم له. أنواعه:<ol><li><b>التلازمي:</b> التمييز بين الأفراد المختلفين.</li><li><b>التنبؤي:</b> تحديد الفروق والاختلافات المستقبلية.</li><li><b>المحتوى:</b> مدى قياسه لخصائص الشيء المدروس.</li><li><b>البناء:</b> ارتباط البناء بأساسه النظري، وله نوعان: التقاربي والتمايزي (مثال المحاضرة: الغلو والتطرف).</li><li><b>الظاهري:</b> يقيس ما ينبغي قياسه (يحكّمه المحكّمون).</li></ol><b>الثبات:</b> درجة إعطاء المقياس قراءات متقاربة كل مرة. أنواعه: الاختبار القبلي والبعدي، الارتباط النصفي، متوسط الارتباط بين الجزء والكل، متوسط الارتباط بين الأجزاء.<div class="tip">المقياس الصادق غالبًا ثابت بدرجة مقبولة، لكن ثبات المقياس لا يعني صدقه.</div>`],
["أنواع المقاييس",`<ul><li><b>ثورستون:</b> أسئلة ومحكّمون ثم ترتيبها حسب القيم.</li><li><b>جوتمان:</b> عبارات متدرجة (مثال المحاضرة: العمالة الوافدة حسب الجنسية).</li><li><b>ليكرت:</b> مجموعة عبارات ومجموعة خيارات.</li><li><b>اختلاف المعنى:</b> يقيس إدراك الشخص للمفهوم (التقويم، القوة، النشاط) من 1 إلى 7، مثل اتجاهات الموظف نحو الرئيس.</li><li><b>المصفوفة الاجتماعية:</b> قياس الشعبية والانسجام بين الجماعات بأسئلة نعم/لا.</li></ul>`],
["المجتمع والعينات وأنواعها وحجمها",`<b>مثال المحاضرة:</b> المجتمع = موظفو الحكومة، مجتمع الدراسة = موظفو الوزارات، إطار العينة = الوزارات الخدمية، العينة = الموظفون الرجال، وحدة العينة = الموظف. المعلمة (تصف المجتمع، مثال المحاضرة: المرتبة 7–15) والإحصائية (تصف العينة، مثال: متوسط المراتب = 9). أخطاء العينة: الصدفة والتحيز.<br><b>غير الاحتمالية:</b> بالمصادفة، الحصصية، حكم الباحث.<br><b>الاحتمالية:</b> العشوائية البسيطة، المنتظمة، الطبقية، العنقودية.<br><b>تحديد الحجم:</b> الطريقة الأولى الجداول الإحصائية، والثانية المعادلة: n = 0.5 × 0.5 × (1.96)² ÷ (0.05)² = 384.<br><b>أدوات جمع البيانات:</b> التجربة، الاستبانة، المقابلة، الملاحظة.`]
]],
["البيانات والتحليل والعرض","من جمع البيانات إلى عرضها بأمانة.",[
["خطوات البحث العلمي",`البحث عمل متكامل: يبدأ بسؤال ← فكرة بحث ← مقترح ← تطبيق عملي وجمع بيانات ← تحليل ← عرض ومناقشة.<br><b>التسلسل:</b> التحديد المبدئي للمشكلة ← الدراسة الاستطلاعية ← التحديد النهائي ← خطة البحث ← البيانات الثانوية (داخلية وخارجية) والأولية ← تصميم البحث الميداني (المقياس، أسلوب الدراسة وتكلفتها) ← إجراء البحث الميداني وقياس الصدق والثبات ← جمع البيانات وترتيبها وترميزها وتحليلها ← النتائج ← التوصيات ← تطبيقها ← المتابعة.`],
["البيانات والمعلومات ومستويات النظم",`<b>البيانات:</b> حقائق خام قد تكون غير مترابطة وغير مجدية بصورتها، وتشبه المواد الخام اللازمة لمصنع. <b>المعلومات:</b> الناتج من معالجة البيانات بالطرق التحليلية والاستنتاجية.<br><b>تحليل المعلومات:</b> حصر وتسجيل وتحليل بيانات وحقائق عن مشكلة لتحديد حلول بديلة واختيار الأمثل.<br><b>مستويات نظم المعلومات (4):</b> مستوى العمليات (القاعدة)، المستوى المعرفي، المستوى الإداري (الإدارات الوسطى)، المستوى الإستراتيجي (الإدارات العليا).`],
["أساليب التحليل: الكمي والكيفي",`<ul><li><b>الكمي (العددي):</b> تفسير البيانات بالأعداد والأرقام والطرق الرياضية والإحصائية والرسوم. أدواته: الاستبيانات، المسح الإحصائي.</li><li><b>الكيفي (النوعي):</b> تحليل الأداء والمواقف واستخلاص نتائج عامة وفرضيات والتعبير عنها بكلمات. أدواته: المجموعة البؤرية، الملاحظة، المقابلة. يستخدمه كثيرون بسبب نوع الظاهرة وقلة البيانات ونوعية التدريب.</li></ul><b>خطوات تحليل المقابلات:</b> استمع للتسجيلات، جهّز موجزًا، حدد الألفاظ والأفكار والمواضيع المشتركة، حدد المعلومات الناقصة، وحدد ما يمكن الاستشهاد به.<br><b>الاستبيانات:</b> جدولة المعطيات الكمية وتلخيصها وتحويلها إلى مخططات، ثم تلخيص في جدول، تمثيل في رسم بياني، وتفسير.<br><b>قبل التحليل:</b> مراجعة البيانات لتلافي القصور والأخطاء والتأكد من وجود استجابات بنسبة معقولة.`],
["برامج التحليل وقاعدة البيانات",`<ul><li><b>Excel:</b> متوفر على أغلب الحواسيب وسهل إدخال المعطيات وتعديلها وجيد مع القوائم والإحصاءات الملخصة (المتوسط، الحد الأدنى والأعلى، الانحراف المعياري)، لكنه محدود في التحليل الإحصائي.</li><li><b>SPSS:</b> برنامج مخصص لتحليل المعطيات بوحدات برمجية، لكنه مكلف لأن كل وحدة تُشترى بمفردها.</li><li><b>Minitab:</b> يعمل على نظم Windows ويعطي التحليلات الوصفية والتقديرات واختبارات النسب.</li></ul><b>قاعدة البيانات:</b> الطريقة التي تُخزَّن بها بيانات الدراسة للوصول إليها لاحقًا للتحليل، مع الاستعانة بمتخصصي الإحصاء.<br><b>أسئلة التخزين الأربعة:</b> ما المعلومات التي ستُخزَّن؟ من يحتاجها ومتى؟ بأي شكل (نسخ خطية أم حاسوب)؟ قيّم احتياجاتك بانتظام وتخلص مما لا تحتاج.`],
["التحيز والتثليث وتحديات التحليل",`التحيز يؤثر في التحليل الكمي والنوعي. وسائل ضبطه:<ol><li><b>التثليث:</b> استخدام عدة طرائق ومصادر وأنواع بيانات ومنظورات للحصول على صورة أشمل.</li><li>اطلب من آخرين فحص الإجابات لتفادي تحيزك.</li><li>إشراك الجهات المعنية في تحليل البيانات وتفسيرها.</li><li>تدوين مذكرات وصفية مستمرة بالكلمات ذاتها وعدم السماح للأفكار الشخصية بالتدخل.</li></ol><b>موجهات:</b> لا تفرط في التعبير عن البيانات النوعية تعبيرًا كميًا (كوضع إجابات مجموعة التركيز في نسب مئوية بدلًا من استكشاف الأفكار والمواقف).`],
["كيف تختار طريقة التحليل؟ (11 خطوة)",`<b>كن واضحًا في ثلاثة جوانب منهجية:</b><ol><li>أوجه التباين والتداخل بين الطرائق المتبعة في الحصول على المعلومات النوعية والكمية.</li><li>الآثار المترتبة على استخدام الطرائق الفردية أو الجماعية.</li><li>ما الذي يجعل طريقة ما تشاركية أو ما الذي يحول دون ذلك.</li></ol><b>خطوات اختيار أنسب طريقة:</b><ol><li>تأكد أنه لا توجد جهة أو فرد أو منظمة تجمع هذه البيانات بالفعل، وتأكد كيف جُمعت لتعرف هل يمكن التعويل عليها.</li><li>كن واضحًا بشأن مستوى الدقة الذي تحتاجه.</li><li>إن كانت المعلومات تتعلق بمجال تخصص معين فاطلب مشورة متخصص أو وثائق متخصصة قبل أن تختار الطريقة.</li><li>تأكد أنك واضح بشأن المعلومات التي تحتاج إلى جمعها وتجميعها وتحليلها أو إعادتها كمعلومات مرتدة.</li><li>كن واضحًا بشأن المهمة، وهل تتعلق بمعلومات نوعية أو كمية، وهل تحتاج طريقة للجمع أو التجميع أو التحليل أو التوليف أو النشر.</li><li>قرر المدى الذي تبلغه عملية الجمع أو التحليل من حيث المشاركة (العمل مع أفراد أو مجموعات أو كليهما).</li><li>قرر مدى تغطية جمع البيانات: عينة أم شاملة. وإن كانت عينة فحدد حجمها ووضّح إطار أخذ العينة وعيّنها.</li><li>هل أمامك خيارات منهجية عديدة أم خيار واحد؟ أحصِ خياراتك وحدد اختيارك مبدئيًا، وإن كانت الطرائق متتابعة فتأكد أنها تتمم بعضها.</li><li>أحصِ طرائقك وحدد اختيارك بصورة مبدئية.</li><li>عند اختيار الطريقة انظر هل هي: معقولة، مناسبة، صحيحة، موثوقة، ملائمة، حساسة، فعالة من حيث التكلفة، وجيدة التوقيت.</li><li>أجرِ اختبارات مبدئية للطريقة مع عدد قليل من المشاركين تماثل ظروفهم ظروف من تسعى للحصول على معلومات عنهم، وعدّل طريقتك على أساس التوصيات.</li></ol>`],
["عرض البيانات: الجداول والرسوم والصور",`<b>طرق العرض:</b> الأشكال التوضيحية والجداول (الأكثر شيوعًا)، العرض الإنشائي (بجمل وعبارات)، العرض البياني.<ul><li><b>الجداول:</b> تنظم البيانات ويسهل تتبعها، وتصنَّف زمنيًا أو جغرافيًا أو كميًا أو نوعيًا. رتّب الصفوف والأعمدة بما يخدم الفكرة، ووحّد الشكل، واجمع الجداول إن أمكن، وقرّب الأرقام للدقة المناسبة (لا تكتب ثلاث خانات عشرية بلا داعٍ).</li><li><b>الرسوم البيانية:</b> الأعمدة، الدوائر النسبية، المربعات، المستطيلات، المدرج التكراري، المضلع، المنحنيات. استخدم رسومًا مبسطة، ولا تستخدم الأشكال ثلاثية الأبعاد لأنها لا تضيف شيئًا وتجعل المقارنة أصعب. تجنب ألوانًا يصعب تمييزها عند التصوير بالأبيض والأسود، واختر مقياس رسم لا يخفي التغيرات.</li><li><b>الصور:</b> لتوضيح ما لا تُظهره الرسوم، اجعلها واضحة وغير معقدة، وأحط الجزء المهم بدائرة.</li></ul><b>عمومًا:</b> الشكل مفهوم دون الرجوع للنص، اذكر المصدر إن نُقلت البيانات، يسبق الشرح الجدول أو الشكل، <b>وكن أمينًا</b> فلا تضلل القارئ ولا تُخفِ ما يضعف رأيك ولا تقرّب الأرقام لإخفاء معلومات.<br><b>العرض الإنشائي:</b> وصف البيانات بجمل وعبارات توضح النتائج المستخلصة، كأن يقول الباحث إن هناك علاقة طردية بين مؤهلات معلمي المرحلة الابتدائية واستخدامهم الوسائل التعليمية.<br><b>إضافات على الرسوم:</b> ضع المعلومات الأساسية بالرسم البياني، وأدرج رموز ومفاتيح الرسم. وإن استخدمت خطوط الشبكة (الطولية والعرضية خلف الرسم) فاستخدمها بحيث يعرف القارئ قيم النقاط بالتقريب، ولا تجعلها كثيرة أو سميكة فتطغى على خطوط الرسم.<br><b>الرسومات التخطيطية:</b> توضح جهازًا أو كائنًا أو عملية (طريقة عمل الجهاز، أجزاء الماكينة، خطوات العملية الإنتاجية أو الإدارية) بطريقة مبسطة تحتوي العناصر الأساسية فقط، مثل مخطط الهيكل التنظيمي أو خطوات عملية عصف الذهن. وعيبا المثال في المحاضرة: لا عنوان للرسم، ولا مفتاح يوضح معنى الرموز (1) و(2). ويجوز استخدام الرموز بشرط وضع مفتاح على الرسم أو بجواره.<br><b>الصور الرقمية أو الفوتوغرافية:</b> تُستخدم لتوضيح ما لا تُظهره الرسومات التخطيطية أو الشرح؛ اجعلها واضحة وتجنب المعقد، وأحيانًا أحط الجزء المهم بدائرة.`],

["تحليل المعلومات وتصنيف البيانات",`<b>القوائم المرتبة:</b> إنشاء القائمة ليس صعبًا، لكن ترتيب عناصرها وتحديد أولويتها يتطلب مهارات التفكير العليا (التحليل والتقييم)، وتُكوَّن المعلومات في أشكال مرئية على الورق أو بالكمبيوتر.<br><b>تحليل المعلومات:</b> عملية حصر وتسجيل وتحليل بيانات ومعلومات وحقائق عن مشكلة معينة لتحديد حلول بديلة واختيار الحل الأمثل في ظل الظروف المحيطة.<br><b>متى لا يُستفاد من تحليل المعلومات؟</b><ul><li>عدم الإلمام الكافي بماهية عملية التحليل، فقد يقتصر على الإلمام بمعلومات معينة اعتمادًا على ذهن القائم بالتحليل (<b>النموذج الذهبي</b>)، ولا تنتج عنه نتائج جيدة إلا عند محدودية المعلومات وقصر النطاق الزمني.</li><li>تجاهل قسم من المعلومات المجمعة.</li><li>عندما يزداد حجم المعلومات ويتسع نطاقها يصبح من الصعب بل المستحيل الاعتماد على النموذج الذهبي، فيلزم الاعتماد على <b>الأسلوب العلمي</b>.</li></ul><b>ملاحظات عند تصنيف البيانات:</b><ol><li>اتباع نظام منطقي: من العام إلى الخاص، أو من الكبير إلى الصغير، أو من الكثير إلى القليل، أو العكس.</li><li>أن تكون لدى الباحث بيانات صالحة للتصنيف مثل الأعمار والمؤهلات والجنسية.</li><li>التدريج من الفئات العريضة إلى الفرعية إذا لزم (يُقسَّم السعوديون بحسب الجنس إلى ذكور وإناث).</li><li>تجانس المفردات المصنفة معًا، فلا توضع مفردة واحدة في عدة أماكن.</li><li>أن يكون النظام شاملًا لمختلف الاستجابات والبيانات.</li><li>أن يكون مرنًا يتسع لبعض التعديلات.</li><li>تحديد مفاهيم ومعاني الفئات بدقة (كثير من الباحثين يفهمونها بطريقة سطحية غير محددة).</li><li>تقنين وتوحيد الأسس المتبعة في ملاحظة المفردات.</li><li>اختيار المقاييس الدالة على الفئات المحددة المختلفة.</li></ol>`],
["مراحل دعم القرار",`<ol><li><b>تحديد المشكلة ودراسة البيئة المحيطة:</b> تحليل بيانات ومعلومات، صناعة مؤشرات، استطلاع رأي المجتمع، دراسة التجارب الدولية، الأجهزة الإحصائية.</li><li><b>صياغة البدائل:</b> تحديد البدائل الممكنة، وضع معايير الاختيار، التنبؤ بالنتائج والقياس.</li><li><b>الاختيار بين البدائل:</b> التوصل للحلول، تحليل الحساسية، اختيار أفضل البدائل، خطة التنفيذ.</li><li><b>اتخاذ القرار والمتابعة:</b> نظم المتابعة، رد الفعل، تقارير المتابعة.</li></ol>`],
["خطوات تحليل البيانات الثلاث وتحضيرها",`<b>مراحل تحليل البيانات في معظم البحوث الاجتماعية (3):</b><ol><li>تنظيف وتنظيم البيانات (تحضير البيانات).</li><li>وصف البيانات (الإحصاءات الوصفية).</li><li>اختبار الفرضيات والنماذج (الإحصاء الاستنتاجي).</li></ol>وصف تحضير البيانات يكون مختصرًا ويركز على الجوانب المتفردة في دراستك. الإحصاءات الوصفية ضخمة، فتُختار بعناية وتُنظَّم في جداول ورسوم توضح أهم المعلومات. ويربط الباحث الإحصاءات الاستنتاجية بأسئلة بحث أو فرضيات أثيرت في المقدمة. وتجنب التفاصيل الزائدة لأن القارئ لن يتابع النتائج الأساسية، وتُترك التفاصيل الدقيقة للملاحق.<br><b>تحضير البيانات (الخطوة الأولى):</b> تسجيل البيانات، اختبار صحتها، إدخالها في الحاسب، تحويلها، إنشاء قاعدة معلومات تحتوي مختلف المقاييس المستخدمة. إن كان الباحث يجيد الحاسب والبرامج فيمكنه القيام بها بمفرده وإلا استعان بمتخصصي الإحصاء.<br><b>تسجيل البيانات:</b> مصادرها استبيانات، مقابلات، اختبارات قبلية وبعدية، ملاحظات. والغرض إعداد قاعدة بيانات الدراسة، <b>ويجب الاحتفاظ بها 5 إلى 7 سنوات على الأقل</b>.<br><b>مراجعة البيانات للتأكد من صحتها (أولًا بأول):</b> هل الإجابات واضحة ومقروءة؟ هل تمت الإجابة عن كل الأسئلة الهامة؟ هل الإجابات مكتملة؟ هل تشمل المعلومات عن الموقف المحدد (الزمان، المكان، الباحث)؟`],
["تحليل الاستبيان: التكرارات والنسب",`في تحليل الاستبيان يُوضع كل سؤال في جدول بإجاباته (نعم / لا / أحيانًا / لا أدري) حسب ما اختارته العينة، ثم عدد من اختار كل إجابة (التكرار)، وبجانبه النسبة المئوية.<ul><li><b>النسبة المئوية = (العدد ÷ العدد الكلي لأوراق الاستبيان) × 100.</b></li><li>لا تكتب طريقة استخراج النسبة بل الناتج فقط.</li><li>لا تكتب الكسور بل قرّبها للواحد الصحيح: 5 فأكثر ترفع (34.6 تصبح 35)، وأقل من النصف تُهمل (34.4 تصبح 34).</li><li>يجب أن يكون المجموع الكلي <b>100%</b> لا أقل ولا أكثر.</li></ul>وبعدها تُلخَّص البيانات في جدول، ثم تُمثَّل في رسم بياني، ثم تُفسَّر.`],
["رحلة انتقال البيانات (6 مراحل)",`<ol><li><b>جمع البيانات:</b> هل يلزم أخذ عينة؟ إن نعم فكيف تُختار ممثلةً لأصحاب المصلحة الأساسيين؟ وإن لا فمن أين تحصل على المعلومات؟ وكيف (قياسات، مقابلات مع الأفراد، مناقشات جماعية، ملاحظة)؟</li><li><b>تسجيل البيانات:</b> من يستخدم النماذج وما النماذج المستخدمة في التدوين والتصوير الفوتوغرافي والتسجيل بالفيديو للبيانات والانطباعات؟</li><li><b>تخزين البيانات:</b> أين تُخزَّن البيانات (الخام والمحللة)، وكيف، ومن يخزنها، ومن تتاح له فرصة الوصول إليها؟</li><li><b>تجميع البيانات:</b> من يجمعها ويصنفها في مجموعات متكاملة على أساس منطقي وبأي طريقة؟</li><li><b>تحليل البيانات:</b> من يفحصها وبأي طريقة لفهم معناها وتوليفها لاستخلاص تفسير متماسك لما حدث ولماذا؟</li><li><b>المعلومات المرتدة:</b> ما المراحل التي تُبلَّغ خلالها المعلومات إلى موظفي المشروع والشركاء وأصحاب المصلحة الأساسيين ولجان التوجيه والوكالات الممولة، وبأي طرائق؟</li></ol>`],
["علم الإحصاء ووظائفه ومراحل التحليل الإحصائي",`<b>علم الإحصاء:</b> العلم المختص بالطرق العلمية لجمع البيانات وتنظيمها وتلخيصها واستعراضها وتحليلها ثم عمل التنبؤات لمجموعة هذه البيانات.<br><b>وظائفه (الاستفادة منه):</b><ul><li><b>تنظيم البيانات (Data Characterization):</b> توضع مجموعة البيانات في مجاميع أو فئات محددة، كل فئة تحتوي جزءًا من البيانات يتفق وطبيعتها (مثلًا بيانات كل معاملة تجريبية على حدة، أو أوزان الطائر حسب كل عمر أو الجنس).</li><li><b>تلخيص البيانات (Data Summarization):</b> اختزال مجموعة ضخمة إلى مجموعة بسيطة من الأرقام، كالمتوسط مع الانحراف القياسي، لوصف مجموعة كبيرة من الأفراد.</li><li><b>استعراض البيانات (Data Presentation):</b> وضعها في جداول فيها المتوسطات، أو في صورة مدى تكراري تتوزع فيه البيانات على فئات، وتُرسم أعمدة أو منحنيات أو مضلعًا تكراريًا.</li><li><b>تصنيف البيانات والتقدير:</b> معرفة هل تتبع مجموعة البيانات نظامًا معينًا في توزيعها، أو هل تتبع مجموعتان مجموعة واحدة من الأفراد، وعمل تقديرات (متوسط العينة يمثل تقديرًا لمتوسط المجتمع).</li><li><b>التكهن أو التنبؤ (Prediction):</b> إذا لاحظ الباحث اتجاهًا معينًا في نتائج عدة تجارب اعتقد أنه عام، ثم يختبر ذلك بتجارب أخرى تعزز فرضه، ومن نتائجها يعمل تكهنات إحصائية.</li></ul><b>مراحل التحليل الإحصائي للبيانات:</b> البيانات (عن مجتمع العينة، الماضي والحاضر، كالإيرادات والمنصرفات) ← المتغيرات (نوعية أو كمية) ← التقدير (حجم العينة ونوعها: عشوائية بسيطة، منتظمة، طبقية، عنقودية) ← الإحصائيات ← الاختبار ← تعميم النتائج والتنبؤ.`],
["الإحصاءات الوصفية",`تصف الملامح الأساسية لبيانات الدراسة وتوفر ملخصات مبسطة عن العينة والمقاييس. ومع تحليل الرسم البياني البسيط تكون <b>أساس التحليل الكمي</b>. وفي كل متغير ننظر إلى خاصيتين:<ul><li><b>التوزيع:</b> ملخص تكرار القيم الفردية للمتغير، ويوصف بجداول التوزيع وجداول النسب المئوية وأنواع الرسم البياني.</li><li><b>النزعة المركزية:</b> تقدير لمركز توزيع القيم، وهي ميل المفردات إلى التراكم أو الاقتراب حول قيمة معينة (القيمة المتوسطة). ثلاثة أنواع:<br>• <b>المتوسط:</b> حاصل جمع القيم مقسومًا على عددها.<br>• <b>الوسيط:</b> القيمة التي في منتصف القيم.<br>• <b>المنوال:</b> أكثر القيم تكرارًا.</li><li><b>التشتت:</b> انتشار القيم حول النزعة المركزية، وله مقياسان: <b>المدى</b> (أكبر قيمة − أقل قيمة، وهو أبسط مقاييس التشتت ويُرمز له R)، و<b>الانحراف المعياري</b> (الجذر التربيعي لمجموع مربعات الانحرافات عن الوسط الحسابي مقسومًا على حجم العينة).</li></ul><b>الرسوم التكرارية:</b><ul><li><b>المدرج التكراري:</b> أعمدة متلاصقة تبين العلاقة بين الفئات والتكرارات.</li><li><b>المضلع التكراري:</b> يبين العلاقة بين مراكز الفئات والتكرارات (نقاط (X, Y) تُوصل)، ويجب إغلاقه من الأمام بافتراض فئة سابقة للفئة الأولى ومن الخلف بفئة لاحقة للأخيرة، تكرار كل منهما صفر. ويُرسم على رسم مستقل أو فوق المدرج.</li><li><b>المنحنى التكراري:</b> يُرسم بنفس طريقة المضلع لكن باليد، ويبين العلاقة بين مراكز الفئات والتكرارات.</li></ul>وفي قائمة الإحصائيات أيضًا: النسبة، الجداول التكرارية، التباين، المنحنى الطبيعي.`],
["موجهات التحليل والتوصيات",`<b>موجهات التحليل:</b><ul><li>لا تفرط في التعبير الكمي عن البيانات النوعية (كمناقشات مجموعة التركيز في جداول ونسب)، بل استكشف الأفكار والمواقف التي تجيب عن «لماذا؟» و«كيف؟».</li><li>الاعتماد على الحقائق والشواهد، والابتعاد عن التأملات والمعلومات التي لا تستند إلى أسس وبراهين.</li><li>الاعتماد على الفرضيات (الحقائق المفترضة) التي تحتاج إلى تأكيد أو استبدال بفرضيات أخرى تنسجم مع المعلومات المستجدة.</li><li>الموضوعية في الوصول إلى النتائج والابتعاد عن العواطف المجردة والتحيز.</li><li>استخدام الملاحظة والحكم الشخصي عند استحالة جمع البيانات.</li><li>استخدام مقاييس بديلة عند عدم وجود مقاييس أصلية.</li><li>استخدام أساليب تحليلية مناسبة للواقع.</li></ul><b>التوصيات:</b> الاعتماد على الأسلوب العلمي في تحليل المعلومات الهائلة المسجلة، الاهتمام بكل المعلومات المجمعة، الإلمام الكافي بماهية عملية التحليل، تجنب خطر التعميم عند تقسيم مدونات تسجيل المقابلات والملاحظات الميدانية إلى فئات حسب المواضيع، وتجنب اختيار الحالات القصوى أو المأساوية واعتبارها نموذجية.<br><span class="note">مراجع المحاضرة: «تحليل المعلومات والبيانات» د. حمد بن إبراهيم العمران، وموقع www.ifad.org/evaluation، وموقع download.intel.com (تحليل المعلومات وترتيبها حسب الأولوية).</span>`]

const CARDS=[["العلم","نشاط إنساني ديناميكي يشكل أحد فروع المعرفة، وهو المعرفة المنسقة الناشئة عن الملاحظة والتجريب."],["البحث العلمي","أسلوب فكري واعٍ ومنظم لبحث الظواهر والمشاكل وأسبابها واختبار العلاقات بينها."],["الاستنباط","الانتقال من مقدمة أو أكثر (معرفة قديمة) إلى معرفة جديدة."],["الاستقراء","التحقق من صدق معرفة جزئية بالملاحظة والتجربة المتكررة لتعميم النتائج، صدق احتمالي."],["الفرض","تفسير أولي لظاهرة معينة، يحتفظ بطابع التخمين حتى توجد الحقائق."],["الفرض الصفري","ينفي وجود علاقة أو فروق بين متغيرين، وهو الأسهل قياسًا."],["الصدق","إلى أي درجة يقيس المقياس ما صُمم له."],["الثبات","درجة إعطاء المقياس قراءات متقاربة في كل مرة يُستخدم فيها."],["التعريف الإجرائي","كيف وبأي وسيلة تُقاس الظاهرة."],["مجتمع الدراسة","المجتمع الذي تُسحب منه العينة."],["التثليث","استخدام عدة طرائق ومصادر وأنواع بيانات للحصول على صورة أشمل وتقليل التحيز."],["المصدر والمرجع","المصدر: مؤلفات الشخصية. المرجع: دراسات الآخرين عنها."],["الخاتمة","حصيلة البحث وتجسيد لنتائجه وما يثيره من إشكاليات جديدة، وليست تلخيصًا حرفيًا."],["البيانات والمعلومات","البيانات حقائق خام، والمعلومات ناتج معالجتها بالطرق التحليلية."],["النزعة المركزية","ميل المفردات إلى التراكم حول قيمة معينة. أنواعها: المتوسط، الوسيط، المنوال."],["المتوسط والوسيط والمنوال","المتوسط: مجموع القيم ÷ عددها. الوسيط: القيمة في المنتصف. المنوال: أكثر القيم تكرارًا."],["المدى والانحراف المعياري","المدى = أكبر قيمة − أصغر قيمة. الانحراف المعياري: الجذر التربيعي لمجموع مربعات الانحرافات عن الوسط ÷ حجم العينة. كلاهما من مقاييس التشتت."],["المدرج والمضلع التكراري","المدرج: أعمدة متلاصقة للفئات والتكرارات. المضلع: يربط مراكز الفئات بالتكرارات ويُغلق بفئتين تكرارهما صفر."],["النموذج الذهبي","الاعتماد على ذهن القائم بالتحليل، ولا يصلح عند كثرة المعلومات واتساع النطاق."],["تحليل المعلومات","حصر وتسجيل وتحليل بيانات ومعلومات عن مشكلة لتحديد حلول بديلة واختيار الأمثل."],["علم الإحصاء","العلم المختص بجمع البيانات وتنظيمها وتلخيصها واستعراضها وتحليلها ثم عمل التنبؤات."]];
const T=S.map(s=>s[0]).concat(["اختبر نفسك"]);
const tb=document.getElementById("tabs"),secs=document.getElementById("secs");
T.forEach((t,i)=>{const b=document.createElement("button");b.textContent=t;b.onclick=()=>show(i);tb.appendChild(b)});
S.forEach(s=>{const d=document.createElement("div");d.className="sec";d.innerHTML=`<div class="intro">${s[1]}</div>`+s[2].map((x,i)=>`<details${i==0?" open":""}><summary>${x[0]}</summary><div>${x[1]}</div></details>`).join("");secs.appendChild(d)});
const ex=document.createElement("div");ex.className="sec";ex.id="exam";secs.appendChild(ex);
function show(i){document.querySelectorAll(".sec").forEach((s,j)=>s.classList.toggle("on",i===j));[...tb.children].forEach((b,j)=>b.classList.toggle("on",i===j));if(i===T.length-1&&!ex.innerHTML)menu()}
document.getElementById("srch").oninput=e=>{const v=e.target.value.trim();document.querySelectorAll(".sec:not(#exam) details").forEach(d=>{const m=v&&d.textContent.includes(v);d.style.display=(!v||m)?"":"none";if(v)d.open=!!m});if(v){document.querySelectorAll(".sec:not(#exam)").forEach(s=>s.classList.add("on"));[...tb.children].forEach(b=>b.classList.remove("on"))}else show(0)};
show(0);
let tmr=null;
function menu(){clearInterval(tmr);ex.innerHTML=`<div class="intro">اختبر نفسك بثلاث طرق: امتحان تجريبي من ${Q.length} سؤالًا، أو بطاقات حفظ للمصطلحات.</div><div class="row"><button class="btn pri" onclick="startExam()">🎯 ابدأ الامتحان</button><button class="btn" onclick="cards()">🗂️ بطاقات الحفظ</button></div><label class="note"><input type="checkbox" id="tm"> مؤقت 20 دقيقة</label>`}
let order,ans,cur;
function startExam(){order=Q.map((_,i)=>i).sort(()=>Math.random()-.5);ans={};cur=0;const t=document.getElementById("tm").checked;if(t){let left=1200;clearInterval(tmr);tmr=setInterval(()=>{left--;const e=document.getElementById("clk");if(e)e.textContent="⏱ "+Math.floor(left/60)+":"+String(left%60).padStart(2,"0");if(left<=0){clearInterval(tmr);finish()}},1000)}render()}
function render(){const k=order[cur],q=Q[k];ex.innerHTML=`<div class="row"><span class="note">السؤال ${cur+1} من ${order.length}</span><span class="note" id="clk"></span></div><div class="bar"><i style="width:${cur/order.length*100}%"></i></div><div class="q"><b>${q[0]}</b>${q[1].map((o,i)=>`<button class="o${ans[k]===i?" sel":""}" onclick="pick(${k},${i})">${o}</button>`).join("")}</div><div class="row"><button class="btn" onclick="go(-1)"${cur?"":" disabled"}>السابق</button><button class="btn pri" onclick="go(1)">${cur==order.length-1?"إنهاء":"التالي"}</button></div>`}
function pick(k,i){ans[k]=i;render()}
function go(d){if(cur+d>=order.length){finish();return}cur=Math.max(0,cur+d);render()}
function finish(){clearInterval(tmr);let sc=0;order.forEach(k=>{if(ans[k]===Q[k][2])sc++});const p=Math.round(sc/order.length*100);ex.innerHTML=`<div class="intro"><div class="big">${sc} / ${order.length} (${p}%)</div>${p>=85?"ممتاز! أنت جاهز.":p>=60?"جيد، راجع الأسئلة الخاطئة أدناه.":"تحتاج مراجعة أكثر، ابدأ بالأخطاء أدناه ثم أعد المحاولة."}</div>`+order.map(k=>{const q=Q[k],ok=ans[k]===q[2];return `<div class="q"><b>${ok?"✅":"❌"} ${q[0]}</b>${q[1].map((o,i)=>`<div class="o ${i===q[2]?"ok":i===ans[k]?"no":""}">${o}</div>`).join("")}<div class="note">${q[3]}</div></div>`}).join("")+`<div class="row"><button class="btn pri" onclick="startExam()">إعادة الامتحان</button><button class="btn" onclick="menu()">القائمة</button></div>`}
let ci=0,flip=false;
function cards(){ci=0;flip=false;drawCard()}
function drawCard(){const c=CARDS[ci];ex.innerHTML=`<div class="row"><span class="note">بطاقة ${ci+1} من ${CARDS.length}</span></div><div class="fc" onclick="flip=!flip;drawCard()">${flip?c[1]:"<b>"+c[0]+"</b>"}</div><div class="note">اضغط على البطاقة لقلبها</div><div class="row"><button class="btn" onclick="ci=(ci+CARDS.length-1)%CARDS.length;flip=false;drawCard()">السابقة</button><button class="btn pri" onclick="ci=(ci+1)%CARDS.length;flip=false;drawCard()">التالية</button><button class="btn" onclick="menu()">القائمة</button></div>`}
</script>
</body></html>
